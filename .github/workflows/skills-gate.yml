# Gate for workbench/ (skills/, projects/) — the checks named in workbench/skills/README.md
# ("Rules this directory enforces mechanically"). Pure Python 3, no Qt, no
# CMake: it validates the skill tree and proves the lint can fail; it does NOT
# compile the Qt templates (that happens in a consuming project's own CI).
#
# Written 2026-10-13. First run happens on the push of the commit that adds it;
# quote the run ID in the session log, not a memory of one.

name: skills-gate

on:
  push:
    paths:
      - "workbench/**"
      - "skills/**"
      - "gifscythe/**"
      - "shotgun-king-anew/**"
      - "package_dropins.py"
      - "test_package_dropins.py"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/skills-gate.yml"
  pull_request:
    paths:
      - "workbench/**"
      - "skills/**"
      - "gifscythe/**"
      - "shotgun-king-anew/**"
      - "package_dropins.py"
      - "test_package_dropins.py"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/skills-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dionysus' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Portable drop-ins (isolated extraction, byte integrity, reproducibility)
        run: |
          python3 skills/validate_skills.py --root . --layout portable --quiet
          python3 -m unittest -v test_package_dropins
          python3 package_dropins.py

      - name: Python version (the gate targets the runner's stock python3)
        run: python3 --version

      - name: Syntax of every Python file under workbench/
        run: python3 -m compileall -q workbench

      - name: qt_lint self-test (the guard must be able to fail)
        run: python3 workbench/skills/qt6-cmake-cpp/scripts/qt_lint.py --selftest

      - name: qt_lint on its own templates (must be clean; machine-path rule included)
        run: python3 workbench/skills/qt6-cmake-cpp/scripts/qt_lint.py workbench/skills/qt6-cmake-cpp/templates

      - name: validate_skills (frontmatter, links, machine paths, universal hash, projects pointers)
        run: python3 workbench/skills/validate_skills.py

      - name: Notebooks parse, Python portions compile, and no outputs are committed
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          def python_portion(source):
              # Colab/Jupyter cells may contain IPython shell escapes (!) and
              # line magics (%cd, etc.), which are not Python syntax. The
              # official KoboldCpp loader cell uses both. Replace only those
              # standalone IPython lines with pass so the remaining Python
              # is still syntax-checked. Cell magics (%%...) are not Python
              # cell bodies and are skipped.
              lines = source.splitlines()
              if any(line.strip().startswith("%%") for line in lines):
                  return ""
              out = []
              for line in lines:
                  stripped = line.lstrip()
                  indent = line[: len(line) - len(stripped)]
                  if stripped.startswith(("!", "%")):
                      out.append(indent + "pass")
                  else:
                      out.append(line)
              return "\n".join(out)

          paths = sorted(Path("workbench").rglob("*.ipynb"))
          for path in paths:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              assert notebook.get("nbformat") == 4, f"{path}: nbformat must be 4"
              for index, cell in enumerate(notebook.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  source = cell.get("source", "")
                  source = "".join(source) if isinstance(source, list) else source
                  ast.parse(python_portion(source), filename=f"{path}:cell-{index}")
                  assert cell.get("outputs", []) == [], f"{path}:cell-{index}: outputs must not be committed"
                  assert cell.get("execution_count") is None, f"{path}:cell-{index}: execution_count must be null"
              print("ok", path)
          print(f"notebooks checked: {len(paths)}")
          PY

      - name: magnet-excavator unit tests (moved under workbench/tools; must still pass)
        run: cd workbench/tools/magnet-excavator && python3 -m unittest -q test_magnet_excavator test_magnet_excavator_gui

      - name: JSON files parse (presets template, committed baselines)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('ok', sys.argv[1])" "$f"
          done < <(git ls-files -z 'workbench/**/*.json' 'skills/**/*.json' 'gifscythe/**/*.json' 'shotgun-king-anew/**/*.json')

      - name: Downloadable drop-in ZIPs
        uses: actions/upload-artifact@v6
        with:
          name: portable-dropins
          path: dropins/*.zip
          if-no-files-found: error
          retention-days: 30
